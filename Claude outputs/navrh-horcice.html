<div class="w"><h1>Břidlice a hořčice</h1><p>Hořčice je použitá na tlačítku Zavolat, telefonu v hlavičce, dolní liště na mobilu, zvýraznění „Bez objednání", dnešním dni v pásu, aktivní záložce ceníku, linkách a špendlících. Pás s hodinami je světlý.</p>
